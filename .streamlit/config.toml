# Identidade visual: verde do campo, fundos neutros e fonte sem serifa.
# O tema pode ser trocado pelo menu ⋮ → Settings → Choose app theme.

[theme]
paddingTop = "1rem"
font = "sans serif"

[theme.light]
primaryColor = "#166534"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f2"
textColor = "#17251c"
borderColor = "#d4ded6"

[theme.dark]
primaryColor = "#4ade80"
backgroundColor = "#0e1712"
secondaryBackgroundColor = "#1b2a20"
textColor = "#f1f5f2"
borderColor = "#3b5142"
